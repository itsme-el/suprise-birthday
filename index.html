
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Selamat Ulang Tahun!</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(to top right, #ffcccc, #ffe6e6);
      font-family: 'Comic Sans MS', cursive, sans-serif;
      overflow: hidden;
      text-align: center;
    }

    h1 {
      margin-top: 50px;
      color: #ff3399;
      font-size: 3em;
      animation: pop 1s ease-in-out infinite alternate;
    }

    @keyframes pop {
      from { transform: scale(1); }
      to { transform: scale(1.05); }
    }

    .cake {
      margin: 30px auto;
      width: 200px;
    }

    .balloons {
      position: absolute;
      bottom: -100px;
      left: 0;
      right: 0;
      z-index: 1;
    }

    .balloon {
      width: 40px;
      height: 60px;
      background: radial-gradient(circle at 30% 30%, #ff99cc, #ff3399);
      border-radius: 50% 50% 45% 45%;
      margin: 10px;
      display: inline-block;
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-300px); }
      100% { transform: translateY(0); }
    }

    .confetti {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }
  </style>
</head>
<body>
  <h1>Selamat Ulang Tahun 🎉🎂</h1>

  <img class="cake" src="https://media.giphy.com/media/l0MYEqEzwMWFCg8rm/giphy.gif" alt="Kue Ulang Tahun" />

  <div class="balloons">
    <div class="balloon"></div>
    <div class="balloon" style="background:#ffcc00;"></div>
    <div class="balloon" style="background:#66ccff;"></div>
    <div class="balloon" style="background:#99ff99;"></div>
  </div>

  <audio autoplay loop>
    <source src="https://www2.cs.uic.edu/~i101/SoundFiles/HappyBirthday.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <canvas class="confetti"></canvas>

  <script>
    // Confetti simple
    const canvas = document.querySelector('.confetti');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const confettiPieces = Array.from({ length: 200 }).map(() => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 6 + 2,
      d: Math.random() * 40,
      color: `hsl(${Math.random() * 360}, 100%, 50%)`
    }));

    function drawConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      confettiPieces.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
        p.y += Math.cos(p.d) + 1;
        p.x += Math.sin(p.d);

        if (p.y > canvas.height) {
          p.y = 0;
          p.x = Math.random() * canvas.width;
        }
      });
      requestAnimationFrame(drawConfetti);
    }
    drawConfetti();
  </script>
</body>
</html>
